<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom New Tab</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Montserrat', sans-serif;
    background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHUBhpLodaDoHWe8JJJYlGjoHhBjI_c38bw-hM-TdAsg&s=10');
    background-size: cover;
    background-position: center;
    color: white;
  }

  .overlay {
    background: rgba(0,0,0,0.55);
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: row;
  }

  /* SIDEBAR */
  .sidebar {
    width: 260px;
    background: rgba(0,0,0,0.7);
    border-right: 2px solid gold;
    padding: 20px;
    box-sizing: border-box;
    transition: 0.3s;
  }

  .sidebar h2 {
    color: gold;
    margin-top: 0;
  }

  .sidebar a {
    display: block;
    margin: 10px 0;
    padding: 10px;
    background: gold;
    color: black;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
  }

  .toggle-btn {
    position: absolute;
    left: 260px;
    top: 20px;
    background: gold;
    color: black;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .collapsed {
    width: 0;
    padding: 0;
    overflow: hidden;
  }

  .collapsed + .toggle-btn {
    left: 20px;
  }

  /* MAIN CONTENT */
  .main {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 3rem;
    font-weight: 700;
    color: gold;
    margin: 0 0 10px 0;
  }

  .clock {
    font-size: 2rem;
    margin-bottom: 20px;
  }

  .search-bar input {
    width: 60%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    font-size: 1.1rem;
    margin-bottom: 30px;
  }

  /* COUNTER */
  .counter-box {
    margin-top: 20px;
    background: rgba(255,255,255,0.1);
    border: 2px solid gold;
    padding: 20px;
    border-radius: 12px;
    width: 350px;
    text-align: center;
  }

  .counter-box h2 {
    margin-top: 0;
    color: gold;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .counter-display {
    font-size: 3rem;
    font-weight: 700;
    background: black;
    border: 2px solid gold;
    padding: 10px 0;
    border-radius: 10px;
    margin: 15px 0;
  }

  .counter-buttons button {
    padding: 10px 18px;
    margin: 5px;
    border: none;
    background: gold;
    color: black;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
  }

  .counter-buttons button:hover {
    background: white;
  }
