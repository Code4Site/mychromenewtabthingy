<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom New Tab</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Montserrat', sans-serif;
    background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHUBhpLodaDoHWe8JJJYlGjoHhBjI_c38bw-hM-TdAsg&s=10');
    background-size: cover;
    background-position: center;
    color: white;
  }

  .overlay {
    background: rgba(0,0,0,0.55);
    width: 100%;
    height: 100vh;
    display: flex;
  }

  /* SIDEBAR */
  .sidebar {
    width: 260px;
    background: rgba(0,0,0,0.7);
    border-right: 2px solid gold;
    padding: 20px;
    box-sizing: border-box;
    transition: 0.3s;
  }

  .sidebar h2 {
    color: gold;
    margin-top: 0;
  }

  .sidebar a {
    display: block;
    margin: 10px 0;
    padding: 10px;
    background: gold;
    color: black;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
  }

  .toggle-btn {
    position: absolute;
    left: 260px;
    top: 20px;
    background: gold;
    color: black;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .collapsed {
    width: 0;
    padding: 0;
    overflow: hidden;
  }

  .collapsed + .toggle-btn {
    left: 20px;
  }

  /* MAIN CONTENT */
  .main {
    flex: 1;
    padding: 40px;
  }

  h1 {
    font-size: 3rem;
    font-weight: 700;
    color: gold;
    margin: 0 0 10px 0;
  }

  .clock {
    font-size: 2rem;
    margin-bottom: 20px;
  }

  .search-bar input {
    width: 60%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    font-size: 1.1rem;
    margin-bottom: 30px;
  }

  /* MUSIC PLAYER */
  .music-player {
    margin-top: 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid gold;
    padding: 20px;
    border-radius: 10px;
    width: 350px;
  }

  .music-player h2 {
    margin-top: 0;
    color: gold;
  }

  /* COUNTER */
  .counter-box {
    margin-top: 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid gold;
    padding: 20px;
    border-radius: 10px;
    width: 350px;
  }

  .counter-box h2 {
    margin-top: 0;
    color: gold;
  }

  .counter-box input {
    width: 80px;
    padding: 6px;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
  }

  .counter-box button {
    padding: 8px 12px;
    margin-left: 6px;
    border: none;
    background: gold;
    color: black;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>

<body>
<div class="overlay">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <h2>Dashboard</h2>
    <a href="LINK_1_HERE">Link 1</a>
    <a href="LINK_2_HERE">Link 2</a>
    <a href="LINK_3_HERE">Link 3</a>
    <a href="LINK_4_HERE">Link 4</a>
    <a href="LINK_5_HERE">Link 5</a>
  </div>

  <div class="toggle-btn" onclick="toggleSidebar()">☰ Menu</div>

  <!-- MAIN CONTENT -->
  <div class="main">
    <h1>Welcome Nicholas</h1>
    <div class="clock" id="clock"></div>

    <div class="search-bar">
      <input type="text" placeholder="Search Google..." id="searchInput">
    </div>

    <!-- MUSIC PLAYER -->
    <div class="music-player">
      <h2>Music Player</h2>
      <audio controls>
        <source src="YOUR_MUSIC_FILE.mp3" type="audio/mpeg">
      </audio>
      <p style="opacity:0.7;">Add your own MP3 file above.</p>
    </div>

    <!-- COUNTER -->
    <div class="counter-box">
      <h2>Times Jayden said "Your face"</h2>
      <input type="number" id="counter" value="0" min="0" max="1000">
      <button onclick="saveCounter()">Save</button>
    </div>

  </div>
</div>

<script>
  // CLOCK
  function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerText =
      now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
  }
  setInterval(updateClock, 1000);
  updateClock();

  // SEARCH
  document.getElementById("searchInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(e.target.value);
    }
  });

  // SIDEBAR
  function toggleSidebar() {
    const bar = document.getElementById("sidebar");
    bar.classList.toggle("collapsed");
  }

  // COUNTER FIX (URL HASH STORAGE)
  function saveCounter() {
    const value = document.getElementById("counter").value;
    location.hash = "counter=" + value;
  }

  // Load counter from URL hash
  if (location.hash.includes("counter=")) {
    const val = location.hash.split("counter=")[1];
    document.getElementById("counter").value = val;
  }
</script>

</body>
</html>
